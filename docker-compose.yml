services:
  db:
    image: postgres:17
    container_name: florist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Caixa de e-mail de mentira para desenvolvimento: recebe os e-mails que a
  # API manda (ex.: "Esqueci minha senha") sem enviar nada de verdade.
  # Caixa de entrada: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: florist-mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata: